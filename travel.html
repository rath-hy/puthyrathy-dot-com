<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel — Rath Hy</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="nav-name">ហ៊ី ពុទ្ធីរតន៍</a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="lyricists-lexicon.html">Lyricist's Lexicon</a></li>
      <li><a href="anota.html">Anota</a></li>
      <li><a href="doodles.html">Doodles</a></li>
      <li><a href="travel.html" class="active">Travel</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1 class="travel-heading">Postcards from Europe</h1>

  <div class="card-grid" id="card-grid"></div>
</main>

<script>
  const toggle = document.querySelector('.nav-toggle');
  const links = document.querySelector('.nav-links');
  toggle.addEventListener('click', () => {
    const open = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
  });

  const CARDS = [
    { photo: "https://picsum.photos/seed/aa/600/400", caption: "Caption goes here." },
    { photo: "https://picsum.photos/seed/bb/600/400", caption: "Caption goes here." },
    { photo: "https://picsum.photos/seed/cc/600/400", caption: "Caption goes here." }
  ];

  const grid = document.getElementById('card-grid');

  CARDS.forEach((data) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-inner">
        <div class="face face-front">
          <img src="${data.photo}" alt="Travel photo">
        </div>
        <div class="face face-back">
          <p>${data.caption}</p>
        </div>
      </div>
    `;
    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
    grid.appendChild(card);
  });
</script>

</body>
</html>
