<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodles · Rath Hy</title>
<link rel="stylesheet" href="../style.css">
<style>
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }

  .doodles {
    max-width: 1100px;
    padding: 72px 24px 80px;
  }

  .doodles-title {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 700;
    line-height: 1;
    margin: 0 0 16px;
  }

  .doodles-intro {
    font-size: 1.15rem;
    color: var(--text-muted);
    max-width: 50ch;
    margin: 0 0 56px;
  }

  .doodle-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }

  .doodle-list a {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 4px 24px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .doodle-list a:hover {
    text-decoration: none;
  }

  .doodle-list a:hover .doodle-name {
    color: var(--accent);
  }

  .doodle-date {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
  }

  .doodle-name {
    font-size: 1.25rem;
    font-weight: 600;
  }

  .doodle-blurb {
    grid-column: 2;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .doodle-empty {
    color: var(--text-muted);
    font-style: italic;
    padding: 20px 0;
  }

  .log-title {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 72px 0 8px;
    padding: 0;
    border: none;
  }

  .log-count {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 16px;
  }

  .log-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 20px);
    grid-auto-columns: 20px;
    gap: 6px;
    margin: 0 0 40px;
    padding-bottom: 4px;
    overflow-x: auto;
  }

  .log-day {
    border-radius: 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }

  .log-day.future {
    background: transparent;
  }

  .log-day.on {
    background: var(--accent);
    border-color: var(--accent);
  }

  .log-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-width: 65ch;
  }

  .log-list li {
    margin: 0 0 32px;
  }

  .log-date {
    display: block;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    margin: 0 0 6px;
  }

  @media (max-width: 640px) {
    .doodles {
      padding: 72px 16px 64px;
    }

    .doodle-list a {
      grid-template-columns: 1fr;
    }

    .doodle-blurb {
      grid-column: 1;
    }
  }
</style>
</head>
<body>

<main class="doodles">
  <h1 class="doodles-title">Doodles</h1>
  <p class="doodles-intro">Things I made without needing a reason. Nothing here is finished, useful, or good, and that's the point.</p>
  <ul class="doodle-list" id="doodle-list"></ul>

  <h2 class="log-title">Log</h2>
  <p class="log-count" id="log-count"></p>
  <div class="log-grid" id="log-grid" aria-label="Days with a doodling session, from day one through the end of the year"></div>
  <ul class="log-list" id="log-list"></ul>
</main>

<script>
  // One entry per doodle, which lives at doodles/<slug>/index.html.
  const doodles = [
    // { slug: 'some-idea', title: 'Some idea', date: '2026-10-29', blurb: 'What sparked it.' },
  ];

  const list = document.getElementById('doodle-list');
  const sorted = [...doodles].sort((a, b) => b.date.localeCompare(a.date));

  if (sorted.length === 0) {
    list.innerHTML = '<li class="doodle-empty">Nothing here yet. Soon.</li>';
  }

  for (const d of sorted) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `${d.slug}/index.html`;

    const date = document.createElement('span');
    date.className = 'doodle-date';
    date.textContent = d.date;

    const name = document.createElement('span');
    name.className = 'doodle-name';
    name.textContent = d.title;

    a.append(date, name);
    if (d.blurb) {
      const blurb = document.createElement('span');
      blurb.className = 'doodle-blurb';
      blurb.textContent = d.blurb;
      a.append(blurb);
    }
    li.appendChild(a);
    list.appendChild(li);
  }

  // One entry per doodling session, in any order; newest is shown first.
  const log = [
    {
      date: '2026-10-29',
      text: "Day one. I set up this corner of my site for things I make just to make them. I spent the session learning how color histograms work: a tally of how much of each color an image contains, ignoring where the colors sit. That led to a question: could an image generator draw any prompt using only the exact pixels of another photo? An identical histogram means the new picture is just a rearrangement of the old one's pixels, so I wrote a notebook that steers Stable Diffusion 3.5 toward a source image's colors while it generates, using sliced optimal transport, then snaps the result to the source's exact pixels. The color-matching parts work on test images. The full thing still needs a GPU run, so results next time.",
    },
  ];

  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const sessionDays = new Set(log.map((e) => e.date));

  document.getElementById('log-count').textContent =
    `${log.length} ${log.length === 1 ? 'session' : 'sessions'} since ${[...sessionDays].sort()[0]}`;

  // Calendar grid: from day one (the first logged session) through Dec 31 of this year,
  // filling columns of 7 top to bottom.
  const grid = document.getElementById('log-grid');
  const [y, m, d0] = [...sessionDays].sort()[0].split('-').map(Number);
  const start = new Date(y, m - 1, d0);
  const today = ymd(new Date());
  const end = new Date(new Date().getFullYear(), 11, 31);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const cell = document.createElement('span');
    const key = ymd(d);
    cell.className = sessionDays.has(key) ? 'log-day on' : key > today ? 'log-day future' : 'log-day';
    cell.title = key;
    grid.appendChild(cell);
  }

  const logList = document.getElementById('log-list');
  for (const e of [...log].sort((a, b) => b.date.localeCompare(a.date))) {
    const li = document.createElement('li');
    const date = document.createElement('span');
    date.className = 'log-date';
    date.textContent = e.date;
    const p = document.createElement('p');
    p.textContent = e.text;
    li.append(date, p);
    logList.appendChild(li);
  }
</script>
<script src="menu.js"></script>

</body>
</html>
