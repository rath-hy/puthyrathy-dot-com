<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodles · Rath Hy</title>
<link rel="stylesheet" href="../style.css">
<style>
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }

  .doodles {
    max-width: 1100px;
    padding: 72px 24px 80px;
  }

  .doodles-title {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 700;
    line-height: 1;
    margin: 0 0 16px;
  }

  .doodles-intro {
    font-size: 1.15rem;
    color: var(--text-muted);
    max-width: 50ch;
    margin: 0 0 56px;
  }

  .doodle-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }

  .doodle-list a {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 4px 24px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .doodle-list a:hover {
    text-decoration: none;
  }

  .doodle-list a:hover .doodle-name {
    color: var(--accent);
  }

  .doodle-date {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
  }

  .doodle-name {
    font-size: 1.25rem;
    font-weight: 600;
  }

  .doodle-blurb {
    grid-column: 2;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .doodle-empty {
    color: var(--text-muted);
    font-style: italic;
    padding: 20px 0;
  }

  .log-title {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 72px 0 8px;
    padding: 0;
    border: none;
  }

  .log-count {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 16px;
  }

  .log-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 20px);
    grid-auto-columns: 20px;
    gap: 6px;
    margin: 0 0 40px;
    padding-bottom: 4px;
    overflow-x: auto;
  }

  .log-day {
    border-radius: 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }

  .log-day.future {
    background: transparent;
  }

  .log-day.on {
    background: var(--accent);
    border-color: var(--accent);
  }

  .log-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-width: 65ch;
  }

  .log-list li {
    margin: 0 0 32px;
  }

  .log-media {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 12px 0 0;
  }

  .log-media img,
  .log-media video {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .log-date {
    display: block;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
    margin: 0 0 6px;
  }

  @media (max-width: 640px) {
    .doodles {
      padding: 72px 16px 64px;
    }

    .doodle-list a {
      grid-template-columns: 1fr;
    }

    .doodle-blurb {
      grid-column: 1;
    }
  }
</style>
</head>
<body>

<main class="doodles">
  <h1 class="doodles-title">Doodles</h1>
  <p class="doodles-intro">Things I made without needing a reason. Nothing here is finished, useful, or good, and that's the point.</p>
  <ul class="doodle-list" id="doodle-list"></ul>

  <h2 class="log-title">Log</h2>
  <p class="log-count" id="log-count"></p>
  <div class="log-grid" id="log-grid" aria-label="Days with a doodling session, from day one through the end of the year"></div>
  <ul class="log-list" id="log-list"></ul>
</main>

<script>
  // One entry per doodle, which lives at doodles/<slug>/index.html.
  const doodles = [
    { slug: 'fold-map', title: 'Fold map', date: '2026-10-31', blurb: 'Predicting which parts of the paper show on a folded crane, then checking with a pencil.' },
    { slug: 'same-pixels', title: 'Same pixels, new picture', date: '2026-10-29', blurb: 'An image generator that can only use the exact pixels of another photo.' },
  ];

  const list = document.getElementById('doodle-list');
  const sorted = [...doodles].sort((a, b) => b.date.localeCompare(a.date));

  if (sorted.length === 0) {
    list.innerHTML = '<li class="doodle-empty">Nothing here yet. Soon.</li>';
  }

  for (const d of sorted) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `${d.slug}/index.html`;

    const date = document.createElement('span');
    date.className = 'doodle-date';
    date.textContent = d.date;

    const name = document.createElement('span');
    name.className = 'doodle-name';
    name.textContent = d.title;

    a.append(date, name);
    if (d.blurb) {
      const blurb = document.createElement('span');
      blurb.className = 'doodle-blurb';
      blurb.textContent = d.blurb;
      a.append(blurb);
    }
    li.appendChild(a);
    list.appendChild(li);
  }

  // One entry per doodling session, in any order; newest is shown first.
  const log = [
    {
      date: '2026-10-29',
      text: "Day one. I set up this corner of my site for things I make just to make them. I spent the session learning how color histograms work: a tally of how much of each color an image contains, ignoring where the colors sit. That led to a question: could an image generator draw any prompt using only the exact pixels of another photo? An identical histogram means the new picture is just a rearrangement of the old one's pixels, so I wrote a notebook that steers Stable Diffusion 3.5 toward a source image's colors while it generates, using sliced optimal transport, then snaps the result to the source's exact pixels. The color-matching parts work on test images. The full thing still needs a GPU run, so results next time.",
    },
    {
      date: '2026-10-30',
      text: "Day two. I ran the same-pixels notebook on a Colab GPU and it works better than I expected. Asked for a snowy mountain using only the pixels of a sunset beach, the model doesn't just tint the snow orange; it relights the whole scene as alpenglow. A black-and-white spy-movie portrait drawn from a photo of Angkor Wat turned into a warmly lit color portrait. Forcing the colors on after the fact, by comparison, gives ugly stripes and blotches, which is the whole point. I wrote up how it works with a proper bibliography, added a cell that records every step of the generation as a video, and gave the project its own page here.",
    },
    {
      date: '2026-10-31',
      text: "Day three, and a new doodle. I'm thinking about an origami project for my computer vision class: printing pictures on paper so they only come together once it's folded, or hiding things in the parts nobody sees. That needs one thing first: knowing which parts of the square stay visible after folding. Working out where each piece of paper lands is easy, but which layer ends up on top is a genuinely hard problem, so I used Flat-Folder, Jason Ku's origami solver, to get the stacking for a traditional crane, then wrote a script that turns it into a map of which parts of the sheet show on each side of the bird. About a quarter of the paper does. Then I tested it for real: I folded a crane out of notebook paper, shaded one side with straight pencil lines and the other with circles, and unfolded it. The shading matches the map.",
    },
    {
      date: '2026-11-01',
      text: "Day four, and the first real illusion. Last night I worked out which way is up on every visible patch of the crane, so I could print a picture on the flat square that lands upright on the folded bird, and turned the whole workflow into a notebook. Then I tried the actual goal: paper that shows one picture flat and different ones folded. I adapted Visual Anagrams, a technique for images that change when you flip them, so that while DeepFloyd generates the image it keeps checking the sheet both flat and folded. Colab crashed from running out of memory the first time, but after some reshuffling I got an oil painting of a city street at night that, folded on the computer, puts a fox on one side of the crane and an owl on the other. This morning I printed it, cut out the square and folded it. The fox shows up, orange with an eye in the right spot. The owl is barely there: the print came out dark and muddy, white creases cut across it, and my folds aren't precise enough. Bolder, simpler pictures should survive a home printer better. Later I started researching a folding story: one sheet that shows a different picture at each stage of folding, say a 0 flat, a 1 at the preliminary base, a 2 at the bird base and a 3 as the finished crane. I got Flat-Folder's solver running outside the browser to work out what paper each stage shows, and set up the generator to handle all four views at once. No satisfying results yet. One problem is that each face of the preliminary base is just an uncut quarter of the sheet, so whatever is printed there is plain to see before you fold anything. A good result depends on choosing the right model, the right stages and the right scenes, so that's what I'm thinking about next.",
      media: [
        { src: 'fold-map/trial1_precut.jpg', alt: 'The city-street painting printed twice on an A4 sheet.' },
        { src: 'fold-map/trial1_timelapse.mp4', alt: 'Timelapse of folding the printed square into a crane.' },
        { src: 'fold-map/trial1_fox.jpg', alt: 'The folded crane from the front, with an orange fox face on its body.' },
        { src: 'fold-map/trial1_owl.jpg', alt: 'The folded crane from the back, where the owl is faint.' },
      ],
      link: 'fold-map/',
    },
    {
      date: '2026-11-02',
      text: "Day five, mostly thinking about why the folding story isn't working yet. The biggest problem turned out to be pixels. The image generator first draws the whole sheet at 64 by 64 pixels, and the finished crane only shows about a tenth of the sheet, so its picture gets composed in a patch about 16 by 22 pixels. Printing the paper bigger doesn't help, since the crane's share of the sheet is fixed by the folds. So I set up an experiment with two fixes: letting the second, high-resolution pass redraw the folded pictures instead of just sharpening them, and running the first pass at 128 pixels. The new story is a home planet seen from above, a rocket on the bird base, and a ringed planet on the finished crane. I also measured a dozen other origami models to see if the crane is even the right one to test on. It hides pictures well but shows little paper. Yakko-san looks better on both counts, except that its in-between folding stages can't be pulled out of its finished creases, so I'd have to work them out by hand. The GPU run came back mixed. Letting the high-resolution pass redraw changed almost nothing, but drawing the first pass at 128 pixels finally made the planet read as a planet on the crane. It also split the rocket into two small ones, and my prompts asking for subjects on a plain light background left pale patches that framed the rocket on the flat sheet instead of hiding it. By the end I'd decided the bird base is the real problem: it's just two big uncut halves of the sheet, so there's nowhere for its picture to hide. Rather than being stuck with the stages a crease-pattern solver can describe, I want to pick stages by folding. So I made a black-and-white calibration sheet, a ChArUco board, the checkerboard of tiny numbered codes that OpenCV uses to calibrate cameras. The idea is to fold it, photograph each view I want a picture on, and let the codes tell the computer which bit of the sheet ended up where. On simulated photos of a folded crane it recovers about 95% of what's visible to within half a millimeter. Next comes printing it and folding it for real.",
    },
    {
      date: '2026-11-04',
      text: "I finally got away from simulations and printed the calibration board. I folded it into a sanbo, a little box, took a photo from above, and outlined the box's floor in magenta on a copy. The code found 149 markers on the real paper and worked out that the floor is one flat piece from the middle of the sheet, accurate to about 0.15 mm. From that it makes the sheet to print, so Holbein's self-portrait should land exactly on the floor once it's folded. The A4 file has the 200 mm square inside a black cut line, with the waste hatched. This isn't the Ambassadors illusion yet: the camera was straight above a flat floor, so the portrait prints undistorted and you can see it on the flat sheet. The real test is a photo from a low angle with the picture spanning the floor and a wall. I also haven't folded the print yet. Then I noticed the recovered pieces had ragged edges, even though origami pieces in a flat fold meet along straight lines, so I added a step that fits straight lines to those seams. On simulated folds of seven models it hadn't been developed on, paper recovered to within half a millimeter went from 96.5% to 97.6%, and paper that was badly wrong almost halved. The crane's seams look much cleaner. An idea I liked, computing each seam from the two neighboring pieces, turned out to be wrong: a crease flips the paper, so two pieces showing the same side aren't joined by one crease. Straightening hasn't been tried on real paper yet.",
    },
    {
      date: '2026-11-05',
      text: "Two things today. First a side trip: Schrödinger's box, an origami box whose walls are printed with noise, so that holding two opposite walls up to a light shows a dead cat and the other pair shows a live one. I printed test sheets, but regular printer paper is too opaque, so it's waiting on tracing paper. Then back to the ChArUco board for the first real anamorphosis attempt. I folded the board into Kunihiko Kasahara's seamless cube and photographed one corner. No hand marking this time: the three visible faces are the canvas, and the markers show they're three 50 mm squares of the sheet meeting at its center, so the middle of the sheet becomes the corner facing the camera. The faces aren't really flat, though. They're bowed, and the top one has a dent, so a flat fit was off by up to about 2 mm. Each face now also gets a thin-plate spline fitted to the markers and the checker corners between them, which predicts points it wasn't fitted to within about 0.1 to 0.3 mm. The output is Holbein's self-portrait smeared into an L shape on an A4 sheet, which should pull together into his face from one spot about 18 cm away. I printed and folded it, and it turned out pretty satisfactory. The 4 mm of extra picture past each edge gave me useful wiggle room. I haven't measured the error yet, and one fold can't tell me how well the bow repeats. In the photo's light, the right face is also at least a third dimmer than the others, so lighting matters too. The other big news: I managed to recruit three partners for this project. It's now called Folded Illusions, and I wrote an onboarding doc to bring them up to speed.",
    },
  ];

  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const sessionDays = new Set(log.map((e) => e.date));

  document.getElementById('log-count').textContent =
    `${log.length} ${log.length === 1 ? 'session' : 'sessions'} since ${[...sessionDays].sort()[0]}`;

  // Calendar grid: from day one (the first logged session) through Dec 31 of this year,
  // filling columns of 7 top to bottom.
  const grid = document.getElementById('log-grid');
  const [y, m, d0] = [...sessionDays].sort()[0].split('-').map(Number);
  const start = new Date(y, m - 1, d0);
  const today = ymd(new Date());
  const end = new Date(new Date().getFullYear(), 11, 31);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const cell = document.createElement('span');
    const key = ymd(d);
    cell.className = sessionDays.has(key) ? 'log-day on' : key > today ? 'log-day future' : 'log-day';
    cell.title = key;
    grid.appendChild(cell);
  }

  const logList = document.getElementById('log-list');
  for (const e of [...log].sort((a, b) => b.date.localeCompare(a.date))) {
    const li = document.createElement('li');
    const date = document.createElement('span');
    date.className = 'log-date';
    date.textContent = e.date;
    const p = document.createElement('p');
    p.textContent = e.text;
    li.append(date, p);
    // Optional photos or videos, shown as a strip of thumbnails linking to the doodle.
    if (e.media) {
      const strip = document.createElement(e.link ? 'a' : 'div');
      strip.className = 'log-media';
      if (e.link) strip.href = e.link;
      for (const m of e.media) {
        let el;
        if (m.src.endsWith('.mp4')) {
          el = document.createElement('video');
          Object.assign(el, { autoplay: true, muted: true, loop: true, playsInline: true });
          el.setAttribute('aria-label', m.alt);
        } else {
          el = document.createElement('img');
          el.alt = m.alt;
          el.loading = 'lazy';
        }
        el.src = m.src;
        strip.appendChild(el);
      }
      li.appendChild(strip);
    }
    logList.appendChild(li);
  }
</script>
<script src="menu.js"></script>

</body>
</html>
